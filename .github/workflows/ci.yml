name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push on the same branch cancels the run that is still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, build and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Required by prisma.config.ts, prisma generate never connects to it
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # Fails if a production dependency has a known high or critical vulnerability
      - run: npm audit --omit=dev --audit-level=high

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Required by prisma.config.ts, prisma generate never connects to it
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tickets_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tickets_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration
      # The tests applied every migration: the database must now match the Prisma schema
      - run: npm run db:check
